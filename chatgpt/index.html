<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChatGPT Exact Formatter</title>
    <!-- KaTeX CSS for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <style>
        body { 
            font-family: Söhne, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; 
            background: #212121; 
            color: #ececec; 
            display: flex; 
            height: 100vh; 
            margin: 0; 
        }
        .pane { 
            width: 50%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
            padding: 20px; 
        }
        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
        }
        .pane h3 { 
            margin: 0; color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; 
        }
        button { 
            background: #10a37f; color: white; border: none; padding: 8px 16px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; 
        }
        button:hover { background: #0b8c6d; }
        textarea { 
            flex: 1; background: #2f2f2f; color: #ececec; padding: 15px; border: 1px solid #444; 
            border-radius: 8px; font-size: 15px; resize: none; outline: none; font-family: monospace; 
        }
        #output { 
            flex: 1; background: #212121; color: #ececec; padding: 20px; border: 1px solid #444; 
            border-radius: 8px; overflow-y: auto; line-height: 1.6; font-size: 16px;
        }
        #output ul { padding-left: 24px; margin-bottom: 1.25rem; }
        #output li { margin-bottom: 0.5rem; }
        #output p { margin-bottom: 1.25rem; }
        .katex-display { margin: 1.5em 0; overflow-x: auto; overflow-y: hidden; text-align: center; }
        table { border-collapse: collapse; width: 100%; margin: 15px 0; background: #2f2f2f; border-radius: 8px; }
        th, td { border: 1px solid #444; padding: 10px 15px; text-align: left; }
        th { background: #3a3a3a; }
    </style>
</head>
<body>

    <div class="pane">
        <div class="header-bar">
            <h3>1. Paste Raw Text Here</h3>
        </div>
        <textarea id="input" placeholder="Paste your ChatGPT text here..." oninput="processText()"></textarea>
    </div>

    <div class="pane">
        <div class="header-bar">
            <h3>2. Formatted Preview</h3>
            <button onclick="downloadForNotion()">Download for Notion</button>
        </div>
        <div id="output">Your formatted output will appear here...</div>
    </div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <script>
        function processText() {
            let text = document.getElementById('input').value;
            let output = document.getElementById('output');
            
            if (!text.trim()) {
                output.innerHTML = "Your formatted output will appear here...";
                return;
            }

            let mathBlocks = [];
            
            // Extract math and replace with placeholders
            text = text.replace(/\$\$\s*([\s\S]*?)\s*\$\$/g, (match, p1) => {
                mathBlocks.push({ display: true, latex: p1 });
                return `%%%MATH_BLOCK_${mathBlocks.length - 1}%%%`;
            });
            text = text.replace(/\\\[\s*([\s\S]*?)\s*\\\]/g, (match, p1) => {
                mathBlocks.push({ display: true, latex: p1 });
                return `%%%MATH_BLOCK_${mathBlocks.length - 1}%%%`;
            });
            text = text.replace(/\$([^\n]+?)\$/g, (match, p1) => {
                mathBlocks.push({ display: false, latex: p1 });
                return `%%%MATH_BLOCK_${mathBlocks.length - 1}%%%`;
            });
            text = text.replace(/\\\((.*?)\\\)/g, (match, p1) => {
                mathBlocks.push({ display: false, latex: p1 });
                return `%%%MATH_BLOCK_${mathBlocks.length - 1}%%%`;
            });

            let html = marked.parse(text);

            if (typeof katex !== 'undefined') {
                mathBlocks.forEach((block, index) => {
                    let rendered = "";
                    try {
                        rendered = katex.renderToString(block.latex, {
                            displayMode: block.display,
                            throwOnError: false
                        });
                    } catch (e) {
                        rendered = `<span style="color:red">[Math Error]</span>`;
                    }
                    html = html.split(`%%%MATH_BLOCK_${index}%%%`).join(rendered);
                });
            }

            output.innerHTML = html;
        }

        function downloadForNotion() {
            let text = document.getElementById('input').value;
            if (!text.trim()) {
                alert("Please paste some text first.");
                return;
            }
            
            // Convert standard ChatGPT math delimiters into Notion's preferred $$ and $ syntax
            let notionText = text.replace(/\\\[\s*([\s\S]*?)\s*\\\]/g, "$$$$\n$1\n$$$$"); 
            notionText = notionText.replace(/\\\((.*?)\\\)/g, "$$$1$$"); 
            
            let blob = new Blob([notionText], { type: 'text/markdown' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'ChatGPT_Notes.md';
            link.click();
        }
    </script>
</body>
</html>
